; Start unit firmware (spec section 3): pistol pulse -> recorded pistol sound + start packet on cable and radio.
;   pio run | pio run -t upload | pio device monitor     (serial console: type "help")
[env:start_unit]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = time
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
