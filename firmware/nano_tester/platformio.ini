; Arduino Nano beacon tester. Open nano_tester.ino in the Arduino IDE (board: Arduino Nano), or:
;   pio run -t upload      (older Nano clones with the old bootloader: board = nanoatmega328)
;   pio device monitor
[platformio]
src_dir = .

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
